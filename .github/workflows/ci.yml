name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Init submodules (vendor/Fable, vendor/fsharp, core)
        uses: ./.github/actions/init-submodules

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Patched F# compiler
        id: fsc
        uses: ./.github/actions/patched-fsc

      - name: Install wasm-tools
        continue-on-error: true
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -LO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      # build.fsx (FAKE) remains the local entry point; CI runs the same steps directly. FAKE 6 needs a net6.0
      # targeting pack and a locked FSharp.Core, and both kept breaking on the runner image (see build.fsx).
      - name: Build Fable.WasmGc and the CLI
        id: build
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          dotnet build src/WasmGc.fsproj -c Release
          dotnet build tools/FSharp.Wasm.Cli/FSharp.Wasm.Cli.fsproj -c Release

      - name: QuickTest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/QuickTest/run.sh

      - name: Showcase
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/Showcase/run.sh

      # The same F# functions on .NET (reference) and as wasm: values must be identical.  Catches wrong
      # behaviour that hand-written expectations can encode (e.g. `%f` without its 6 decimals).
      - name: Differential (.NET vs wasm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          bash tests/Differential/run.sh tests/QuickTest tests/QuickTest/output/QuickTestWasmGc.wasm test
          bash tests/Differential/run.sh tests/Showcase tests/Showcase/output/Showcase.wasm showcase

      # Generated inputs (edge values + seeded random) on .NET and as wasm, for int / float / bool functions.
      # Reproduce a failure locally with the same DIFF_SEED; raise DIFF_CASES for a deeper run.
      - name: Properties (.NET vs wasm, generated inputs)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/Differential/run-props.sh

      # Same F# functions as .NET (Release) and as wasm on node: results must be identical (the checksum), the times
      # are printed to the job summary.  Timing is informational — shared runners are too noisy to gate on.
      - name: Benchmarks (.NET vs wasm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          bash tests/Bench/run.sh | tee bench.txt
          { echo '### Benchmarks (.NET Release vs wasm / node)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Component Embed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-embed && bash run.sh

      - name: Component Linking
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-linking && bash run.sh
