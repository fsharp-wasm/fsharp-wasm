name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Init submodules (vendor/Fable, vendor/fsharp, core)
        uses: ./.github/actions/init-submodules

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Patched F# compiler
        id: fsc
        uses: ./.github/actions/patched-fsc

      # a fixed version (the one the checks were made with); no call to the GitHub API, whose unauthenticated limit fails this step now and then
      - name: Install wasm-tools
        env:
          WASM_TOOLS: 1.263.0
        run: |
          curl -sSfL --retry 4 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS}/wasm-tools-${WASM_TOOLS}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          sudo install -m755 "$RUNNER_TEMP/wasm-tools-${WASM_TOOLS}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      # build.fsx (FAKE) remains the local entry point; CI runs the same steps directly. FAKE 6 needs a net6.0
      # targeting pack and a locked FSharp.Core, and both kept breaking on the runner image (see build.fsx).
      - name: Build Fable.WasmGc and the CLI
        id: build
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          dotnet build src/WasmGc.fsproj -c Release
          dotnet build tools/FSharp.Wasm.Cli/FSharp.Wasm.Cli.fsproj -c Release

      - name: QuickTest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/QuickTest/run.sh

      # bool[] / byte[] are packed to 8 bits by default; the unpacked layout (WASMGC_PACKED_BYTES=0) stays tested
      - name: QuickTest with unpacked bool[] and byte[]
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          WASMGC_PACKED_BYTES: "0"
        run: bash tests/QuickTest/run.sh

      # The inlining pass of the optimizer is opt-in (WASMGC_INLINE=1): the same suite with it on, so that it does not rot
      - name: QuickTest with the inlining pass
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          WASMGC_INLINE: "1"
        run: bash tests/QuickTest/run.sh

      - name: Showcase
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/Showcase/run.sh

      # Strings across the host boundary without the JS String Builtins (WASMGC_STRING_ABI=exports): the module imports no
      # `wasm:js-string`, and round trips of non-ASCII text work on a host that only has the accessor exports.
      - name: String ABI (exports)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/StringAbi/run.sh

      # The same F# functions on .NET (reference) and as wasm: values must be identical.  Catches wrong
      # behaviour that hand-written expectations can encode (e.g. `%f` without its 6 decimals).
      - name: Differential (.NET vs wasm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          bash tests/Differential/run.sh tests/QuickTest tests/QuickTest/output/QuickTestWasmGc.wasm test
          bash tests/Differential/run.sh tests/Showcase tests/Showcase/output/Showcase.wasm showcase

      # Generated inputs (edge values + seeded random) on .NET and as wasm, for int / float / bool functions.
      # Reproduce a failure locally with the same DIFF_SEED; raise DIFF_CASES for a deeper run.
      - name: Properties (.NET vs wasm, generated inputs)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/Differential/run-props.sh

      # What tests/run-all.sh runs beyond the steps above.  All five passed on Node 22 (the version of this job) before they were added.
      - name: IR pass tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: dotnet run -c Release --project tests/PassTests

      - name: Host interop (callbacks, strings and closures across the boundary)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/HostInterop/run.sh

      - name: QuickTestMulti (one compilation per domain)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/QuickTestMulti/run.sh

      - name: BCL bootstrap
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/BclBootstrap/run.sh

      - name: Backend harness (scenarios and closure fuzz)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/BackendHarness/run.sh

      # Same F# functions as .NET (Release) and as wasm on node: results must be identical (the checksum), the times
      # are printed to the job summary.  Timing is informational — shared runners are too noisy to gate on.
      - name: Benchmarks (.NET vs wasm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          bash tests/Bench/run.sh | tee bench.txt
          { echo '### Benchmarks (.NET Release vs wasm / node)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Component Embed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-embed && bash run.sh

      - name: Component Linking
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-linking && bash run.sh

      # Wasmecto, the test framework compiled to WasmGC, and the project written with it (tests/Wasm, run in Node).
      # fsharp-wasmecto is pinned to a commit, like the repositories the backend CI checks out.
      - name: Check out fsharp-wasmecto
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasmecto
          ref: 0f0f4e63f86e77d2b2bd4f788f024d72209cdb1a
          path: .deps/fsharp-wasmecto

      - name: Wasmecto tests (tests/Wasm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          FSHARP_WASMECTO_DIR: ${{ github.workspace }}/.deps/fsharp-wasmecto
        run: bash tests/Wasm/run-tests.sh

      # The framework's own tests (Math, Dictionary, Stack, StringBuilder), compiled against the `core` submodule
      - name: Wasmecto's own tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          FSHARP_WASM: ${{ github.workspace }}
        run: bash .deps/fsharp-wasmecto/run-tests.sh

      # Real programs as a gate (tests/Dogfood/run.sh): the platform's own libraries and the newsletter designer are compiled by this
      # compiler and run.  Both repositories are pinned to a commit; bump the pins when they change (and they pin this compiler back).
      - name: Check out fsharp-wasm-core (the standard libraries)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-core
          ref: 645a99fccc5382c12cd0bb68f6b75dbb234b0e37
          path: .deps/fsharp-wasm-core
          submodules: true

      - name: Dogfood - FSharp.Wasm.Data, FSharp.Wasm.Ui and FSharp.Wasm.Edit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          FSHARP_CORE_DIR: ${{ github.workspace }}/.deps/fsharp-wasm-core
        run: bash tests/Dogfood/run.sh core-libs

      - name: Check out fsharp-wasm-newsletter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-newsletter
          ref: 9a9cb001acd29567010b872143297af420638cc4
          path: .deps/fsharp-wasm-newsletter
          submodules: true

      - name: Dogfood - the newsletter library and the designer module
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          FSHARP_NEWSLETTER_DIR: ${{ github.workspace }}/.deps/fsharp-wasm-newsletter
        run: bash tests/Dogfood/run.sh newsletter

      - name: Check out fsharp-wasm-ide
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-ide
          ref: aa0bdca38502b050a15eea254ab833046e470f9a
          path: .deps/fsharp-wasm-ide
          submodules: true

      - name: Dogfood - the widget editor (the FSharp.Graphics stack as one module)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          FSHARP_IDE_DIR: ${{ github.workspace }}/.deps/fsharp-wasm-ide
        run: bash tests/Dogfood/run.sh widget-editor
