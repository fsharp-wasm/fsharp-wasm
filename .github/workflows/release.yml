name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: production

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools
        continue-on-error: true
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -LO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Build
        run: dotnet build src/Fable.WasmGc.fsproj -c Release -p:Version=${GITHUB_REF_NAME#v}

      - name: QuickTest
        run: cd tests/QuickTest && bash run.sh

      - name: Showcase
        run: cd tests/Showcase && bash run.sh

      - name: Component Embed
        run: cd examples/component-embed && bash run.sh

      - name: Component Linking
        run: cd examples/component-linking && bash run.sh

      - name: Publish compiler (linux-x64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -o publish/linux-x64

      - name: Publish compiler (win-x64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r win-x64 \
            --self-contained \
            -o publish/win-x64

      - name: Publish compiler (osx-x64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r osx-x64 \
            --self-contained \
            -o publish/osx-x64

      - name: Publish compiler (osx-arm64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r osx-arm64 \
            --self-contained \
            -o publish/osx-arm64

      - name: Package artifacts
        run: |
          cd src/bin/Release/net10.0
          zip -r "$GITHUB_WORKSPACE/publish/Fable.WasmGc-net10.0.zip" .
          cd "$GITHUB_WORKSPACE"
          dotnet pack src/Fable.WasmGc.fsproj \
            -c Release \
            -p:Version=${GITHUB_REF_NAME#v} \
            -o publish/nuget
          cd publish
          tar czf fsharp-wasm-linux-x64.tar.gz -C linux-x64 .
          tar czf fsharp-wasm-osx-x64.tar.gz -C osx-x64 .
          tar czf fsharp-wasm-osx-arm64.tar.gz -C osx-arm64 .
          cd win-x64 && zip -r ../fsharp-wasm-win-x64.zip . && cd ..

      - name: Publish NuGet package
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push publish/nuget/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/Fable.WasmGc-net10.0.zip
            publish/nuget/*.nupkg
            publish/fsharp-wasm-linux-x64.tar.gz
            publish/fsharp-wasm-osx-x64.tar.gz
            publish/fsharp-wasm-osx-arm64.tar.gz
            publish/fsharp-wasm-win-x64.zip
