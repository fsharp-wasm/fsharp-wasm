name: Release

# Tag vX.Y.Z[-suffix] publishes a release: the compiler CLI as self-contained binaries (with FSharp.Wasm.Core, the core submodule, next to
# them — the other repositories fetch the compiler from here instead of embedding it as a submodule) and the NuGet packages.
# A release is made by "Run workflow" on main with the input `version` (X.Y.Z or X.Y.Z-suffix): the run does everything below and makes the tag v<version> itself, with the GitHub
# release, once the packages are pushed (a run that fails before that leaves no tag, and can be run again).  Pushing a tag v<version> on main by hand does the same.
# Run without a version it is a dry run: everything but the push, the release and the tag, and the files uploaded as an artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (X.Y.Z or X.Y.Z-suffix) from main, and make its tag v<version>; empty: a dry run that publishes nothing"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # a release (a tag, or a run that was asked for a version) is the environment `production`; the context `steps` is not there yet, so the inputs are asked
    environment: ${{ (github.ref_type == 'tag' || github.event.inputs.version != '') && 'production' || 'dry-run' }}
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}   # job level: a step-level `env` is not visible to that step's `if`

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0   # for the check that a tag is on main

      - name: Init submodules (vendor/Fable, vendor/fsharp, core)
        uses: ./.github/actions/init-submodules

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Patched F# compiler
        id: fsc
        uses: ./.github/actions/patched-fsc

      # a fixed version (the one the checks were made with); no call to the GitHub API, whose unauthenticated limit fails this step now and then
      - name: Install wasm-tools
        env:
          WASM_TOOLS: 1.263.0
        run: |
          curl -sSfL --retry 4 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS}/wasm-tools-${WASM_TOOLS}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          sudo install -m755 "$RUNNER_TEMP/wasm-tools-${WASM_TOOLS}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      # No FAKE here: FAKE 6 runs on net6 with FSharp.Core 8 and breaks on the runner image (see ci.yml).  The same
      # dotnet commands the build uses; the tests run in CI on the commit that is tagged.
      - name: Version, and whether this is a release
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == v* && "$v" =~ $semver ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-suffix"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main: a release is tagged on main"; exit 1; }
            release=true
          elif [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
            [[ "$v" =~ $semver ]] || { echo "::error::'$INPUT_VERSION' is not X.Y.Z or X.Y.Z-suffix"; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::a release is made from main, not from $GITHUB_REF"; exit 1; }
            ! git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null 2>&1 || { echo "::error::v$v exists already"; exit 1; }
            release=true
          else
            v="0.0.0-dryrun"
            release=false
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: NuGet packages
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          dotnet pack src/WasmGc.fsproj -c Release -p:Version=${{ steps.version.outputs.value }} -o publish/nuget
          dotnet pack tools/FSharp.Wasm.Cli/FSharp.Wasm.Cli.fsproj -c Release -p:Version=${{ steps.version.outputs.value }} -o publish/nuget
          # the dotnet new template (examples/hello-wasm is its content)
          dotnet pack tools/FSharp.Wasm.Templates/FSharp.Wasm.Templates.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o publish/nuget

      - name: Self-contained CLI binaries (with FSharp.Wasm.Core beside them)
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          for rid in linux-x64 osx-x64 osx-arm64 win-x64; do
            dotnet publish tools/FSharp.Wasm.Cli/FSharp.Wasm.Cli.fsproj -c Release -r "$rid" --self-contained \
              -p:PublishReadyToRun=false -p:Version=${{ steps.version.outputs.value }} -o "publish/$rid"
          done

      - name: Package CLI binaries as archives
        run: |
          cd publish
          tar czf fsharp-wasm-linux-x64.tar.gz  -C linux-x64  .
          tar czf fsharp-wasm-osx-x64.tar.gz    -C osx-x64    .
          tar czf fsharp-wasm-osx-arm64.tar.gz  -C osx-arm64  .
          cd win-x64 && zip -r ../fsharp-wasm-win-x64.zip . && cd ..
          # what fsharp-wasm-runtime's build.js (FSHARP_WASM_VERSION) checks a download against
          sha256sum fsharp-wasm-*.tar.gz fsharp-wasm-*.zip > SHA256SUMS

      # What is released must itself compile and run a program: unpack the linux-x64 archive and let it compile the QuickTest, which Node then runs
      # (the same 686 checks as CI, with the packed binary instead of `dotnet run`).  A tag whose archive cannot do that publishes nothing.
      - name: Smoke test of the linux-x64 archive
        run: |
          d="$RUNNER_TEMP/released-cli"; rm -rf "$d"; mkdir -p "$d"
          tar xzf publish/fsharp-wasm-linux-x64.tar.gz -C "$d"
          "$d/fsharp-wasm" tests/QuickTest --outDir tests/QuickTest/output --noCache
          wasm-tools validate tests/QuickTest/output/QuickTestWasmGc.wasm --features gc
          node tests/QuickTest/test-runner.mjs

      # Get Started as a stranger does it: the packed tool and the packed template installed from the files that would be published, into an empty HOME and
      # NuGet cache, a project made with `dotnet new`, compiled, validated and run by Node.  A tag whose packages cannot do that publishes nothing.
      - name: Smoke test of the tool and the template (Get Started)
        run: |
          set -e
          export HOME="$RUNNER_TEMP/stranger" NUGET_PACKAGES="$RUNNER_TEMP/stranger-nuget" DOTNET_CLI_TELEMETRY_OPTOUT=1
          unset FSHARP_COMPILER
          mkdir -p "$HOME" "$RUNNER_TEMP/stranger-work"; cd "$RUNNER_TEMP/stranger-work"
          dotnet tool install FSharp.Wasm.Cli --tool-path "$RUNNER_TEMP/stranger-tools" --add-source "$GITHUB_WORKSPACE/publish/nuget" --version "${{ steps.version.outputs.value }}"
          dotnet new install "$GITHUB_WORKSPACE/publish/nuget/FSharp.Wasm.Templates.${{ steps.version.outputs.value }}.nupkg"
          dotnet new fsharp-wasm -n hello
          cd hello
          "$RUNNER_TEMP/stranger-tools/fsharp-wasm" . --outDir out
          wasm-tools validate out/hello.wasm --features gc
          node run.mjs | tee run.txt
          grep -q "fibonacci 10          = 55" run.txt

      # A release that publishes nothing is a failed release: without the key a tag run stops here, red, before anything is pushed or released.
      - name: The key for nuget.org is there
        if: steps.version.outputs.release == 'true' && env.NUGET_API_KEY == ''
        run: |
          echo "::error::the secret NUGET_API_KEY is not visible to this job: an organisation secret has to be given access to fsharp-wasm (and, with the environment production, the environment has to see it)"
          exit 1

      - name: Publish to NuGet.org
        if: steps.version.outputs.release == 'true'
        run: |
          dotnet nuget push publish/nuget/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      # Also publish to GitHub Packages (free repo-scoped feed — no NUGET_API_KEY needed).
      - name: Publish to GitHub Packages
        if: steps.version.outputs.release == 'true'
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            2>/dev/null || true
          dotnet nuget push publish/nuget/*.nupkg \
            --source github \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: GitHub release (and its tag, when it is not there yet)
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            publish/nuget/*.nupkg
            publish/fsharp-wasm-linux-x64.tar.gz
            publish/fsharp-wasm-osx-x64.tar.gz
            publish/fsharp-wasm-osx-arm64.tar.gz
            publish/fsharp-wasm-win-x64.zip
            publish/SHA256SUMS

      # a dry run (or any run) keeps what would have been released
      - name: Keep the archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: |
            publish/nuget/*.nupkg
            publish/fsharp-wasm-*.tar.gz
            publish/fsharp-wasm-*.zip
            publish/SHA256SUMS
