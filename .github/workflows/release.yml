name: Release

# Tag vX.Y.Z[-suffix] publishes a release: the compiler CLI as self-contained binaries (with FSharp.Wasm.Core, the core submodule, next to
# them — the other repositories fetch the compiler from here instead of embedding it as a submodule) and the NuGet packages.
# "Run workflow" (workflow_dispatch) runs the same build without publishing anything and keeps the archives as an artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'dry-run' }}
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}   # job level: a step-level `env` is not visible to that step's `if`

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Init submodules (vendor/Fable, vendor/fsharp, core)
        uses: ./.github/actions/init-submodules

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Patched F# compiler
        id: fsc
        uses: ./.github/actions/patched-fsc

      - name: Install wasm-tools
        continue-on-error: true
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -LO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      # No FAKE here: FAKE 6 runs on net6 with FSharp.Core 8 and breaks on the runner image (see ci.yml).  The same
      # dotnet commands the build uses; the tests run in CI on the commit that is tagged.
      - name: Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dryrun"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: NuGet packages
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          dotnet pack src/WasmGc.fsproj -c Release -p:Version=${{ steps.version.outputs.value }} -o publish/nuget
          dotnet pack tools/FSharp.Wasm.Cli/FSharp.Wasm.Cli.fsproj -c Release -p:Version=${{ steps.version.outputs.value }} -o publish/nuget

      - name: Self-contained CLI binaries (with FSharp.Wasm.Core beside them)
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          for rid in linux-x64 osx-x64 osx-arm64 win-x64; do
            dotnet publish tools/FSharp.Wasm.Cli/FSharp.Wasm.Cli.fsproj -c Release -r "$rid" --self-contained \
              -p:PublishReadyToRun=false -p:Version=${{ steps.version.outputs.value }} -o "publish/$rid"
          done

      - name: Package CLI binaries as archives
        run: |
          cd publish
          tar czf fsharp-wasm-linux-x64.tar.gz  -C linux-x64  .
          tar czf fsharp-wasm-osx-x64.tar.gz    -C osx-x64    .
          tar czf fsharp-wasm-osx-arm64.tar.gz  -C osx-arm64  .
          cd win-x64 && zip -r ../fsharp-wasm-win-x64.zip . && cd ..
          # what fsharp-wasm-runtime's build.js (FSHARP_WASM_VERSION) checks a download against
          sha256sum fsharp-wasm-*.tar.gz fsharp-wasm-*.zip > SHA256SUMS

      - name: Publish to NuGet.org
        if: github.ref_type == 'tag' && env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push publish/nuget/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      # Also publish to GitHub Packages (free repo-scoped feed — no NUGET_API_KEY needed).
      - name: Publish to GitHub Packages
        if: github.ref_type == 'tag'
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            2>/dev/null || true
          dotnet nuget push publish/nuget/*.nupkg \
            --source github \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            publish/nuget/*.nupkg
            publish/fsharp-wasm-linux-x64.tar.gz
            publish/fsharp-wasm-osx-x64.tar.gz
            publish/fsharp-wasm-osx-arm64.tar.gz
            publish/fsharp-wasm-win-x64.zip
            publish/SHA256SUMS

      # a dry run (or any run) keeps what would have been released
      - name: Keep the archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: |
            publish/nuget/*.nupkg
            publish/fsharp-wasm-*.tar.gz
            publish/fsharp-wasm-*.zip
            publish/SHA256SUMS
